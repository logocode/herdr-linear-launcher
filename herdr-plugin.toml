id = "logocode.linear-launcher"
name = "Linear Launcher"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Paste a Linear issue link to start Codex or Claude in a background worktree"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Start agent from Linear link"
contexts = ["workspace", "tab", "pane"]
command = ["node", "plugin.mjs", "open"]

[[panes]]
id = "form"
title = "Linear Launcher"
placement = "popup"
width = 68
height = 22
command = ["node", "plugin.mjs", "form"]
